name: Release

# Builds the downloadable packages for macOS, Windows and Linux, and tests the
# backend in `server/`.
#
# - Every push to main and every manual run builds and tests all three and
#   keeps the packages as workflow artifacts.
# - Pushing a tag like v0.1.0 additionally creates a *draft* GitHub release
#   with the packages attached. Nothing is public until the draft is published
#   by hand on the Releases page.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The backend is a separate crate with no desktop dependencies, so it is
  # tested once on Linux rather than three times alongside the app packages.
  server:
    name: Server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p prettypomodoro-server --locked

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: PrettyPomodoro-macos-universal.zip
          - name: Windows (x64)
            os: windows-latest
            targets: ""
            artifact: PrettyPomodoro-windows-x64.zip
          - name: Linux (x64)
            os: ubuntu-22.04
            targets: ""
            artifact: PrettyPomodoro-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Test
        run: cargo test --release --locked

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/bundle.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/package.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/prettypomodoro.exe dist/PrettyPomodoro.exe
          Compress-Archive -Force -Path dist/PrettyPomodoro.exe -DestinationPath dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PrettyPomodoro-macos-universal.zip
            dist/PrettyPomodoro-windows-x64.zip
            dist/PrettyPomodoro-linux-x64.tar.gz
