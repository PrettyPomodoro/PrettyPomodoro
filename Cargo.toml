[package]
name = "pomodoro"
version = "0.1.0"
edition = "2021"
description = "A small, themeable Pomodoro timer written in pure Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
rodio = { version = "0.20", default-features = false }
notify-rust = "4"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
raw-window-handle = "0.6"
ab_glyph = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
